<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Spot On</title>
<style>
  :root {
    --bg: #f6f3ec;
    --surface: #ffffff;
    --border: #e7e1d4;
    --hairline: #efeadf;
    --ink: #1a1a1a;
    --muted: #8a8275;
    --soft: #efeae0;
    --accent: #01736b;
    --accent-deep: #015e58;
    --accent-soft: #e6efed;
    --danger: #a83232;
    --danger-soft: #fbeaea;
    --good: #2a8c5a;
    --good-soft: #e6f1e9;
    --r: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  #app {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .screen {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .screen.center {
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .top .crumb { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px 16px;
  }
  .divider { height: 1px; background: var(--hairline); }

  /* Dice */
  .die {
    position: relative;
    width: 38px; height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    flex-shrink: 0;
    box-shadow: 0 1px 1.5px rgba(0,0,0,0.04);
  }
  .die.match { border-color: var(--accent); background: var(--accent-soft); }
  .die.hidden { background: var(--soft); border-color: var(--soft); box-shadow: none; }
  .pip {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--ink);
    transform: translate(-50%, -50%);
  }
  .pip-tl { top: 25%; left: 25%; }
  .pip-tr { top: 25%; left: 75%; }
  .pip-ml { top: 50%; left: 25%; }
  .pip-mc { top: 50%; left: 50%; }
  .pip-mr { top: 50%; left: 75%; }
  .pip-bl { top: 75%; left: 25%; }
  .pip-br { top: 75%; left: 75%; }

  .dice-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }

  /* Bid */
  .bid { text-align: center; padding: 4px 0; }
  .bid .by { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .bid .value { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .bid .num { color: var(--accent); }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    vertical-align: 3px;
  }

  /* Table seats */
  .seat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    gap: 10px;
  }
  .seat + .seat { border-top: 1px solid var(--hairline); }
  .seat-name {
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    color: var(--muted);
  }
  .seat.me .seat-name { color: var(--ink); font-weight: 600; }
  .seat.dead .seat-name { text-decoration: line-through; }
  .seat.active .seat-name::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 2px;
    flex-shrink: 0;
  }
  .seat .dice-row { justify-content: flex-end; flex-wrap: nowrap; }
  .tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--soft);
    color: var(--muted);
  }
  .tag.bid { background: var(--accent-soft); color: var(--accent); }
  .tag.offline { background: var(--danger-soft); color: var(--danger); }

  /* Picker */
  .face-row { display: flex; gap: 6px; justify-content: center; }
  .face-btn {
    border: 2px solid transparent;
    background: transparent;
    padding: 3px;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
  }
  .face-btn:hover:not(:disabled) { background: var(--soft); }
  .face-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .face-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .stepper .qty {
    font-size: 26px;
    font-weight: 600;
    min-width: 40px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .step-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 18px; line-height: 1;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .step-btn:hover:not(:disabled) { background: var(--soft); }
  .step-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 11px 14px;
    border-radius: 10px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s, transform 0.05s;
  }
  .btn:hover:not(:disabled) { background: var(--soft); }
  .btn:active:not(:disabled) { transform: scale(0.985); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover:not(:disabled) { background: var(--danger); color: white; }
  .btn.full { width: 100%; padding: 13px; font-size: 15px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 8px 10px; }
  .btn.ghost:hover:not(:disabled) { background: var(--soft); color: var(--ink); }

  /* Inputs */
  input[type="text"] {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 11px 12px;
    border-radius: 10px;
    font: inherit;
    width: 100%;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  input.code {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 18px;
    text-align: center;
    padding-left: 18px;
  }

  /* Menu / brand */
  .brand-huge {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 2px;
  }
  .brand-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }
  .form-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 280px;
  }
  .form-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: -4px;
    align-self: flex-start;
  }
  .err {
    font-size: 13px;
    color: var(--danger);
    text-align: center;
    min-height: 18px;
  }

  /* Lobby */
  .room-code {
    font-size: 38px;
    font-weight: 700;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.18em;
    padding-left: 0.18em;
    color: var(--ink);
  }
  .lobby-player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }
  .lobby-player + .lobby-player { border-top: 1px solid var(--hairline); }
  .lobby-name { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .online-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--good);
    flex-shrink: 0;
  }
  .online-dot.offline { background: var(--muted); }

  /* Reveal */
  .reveal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    gap: 10px;
  }
  .reveal-row + .reveal-row { border-top: 1px solid var(--hairline); }
  .reveal-row .name { font-size: 13px; font-weight: 500; min-width: 70px; }
  .reveal-row.gained { background: var(--good-soft); margin: 0 -10px; padding: 8px 10px; border-radius: 8px; }
  .reveal-row.lost { background: var(--danger-soft); margin: 0 -10px; padding: 8px 10px; border-radius: 8px; }
  .reveal-row.gained + .reveal-row, .reveal-row.lost + .reveal-row { border-top-color: transparent; }
  .reveal-row.dead .name { color: var(--muted); text-decoration: line-through; }
  .reveal-row .dice-row { justify-content: flex-end; }
  .reveal-row .die { width: 30px; height: 30px; border-radius: 7px; }
  .reveal-row .pip { width: 4px; height: 4px; }

  .verdict { text-align: center; padding: 10px 0 4px; }
  .verdict .count { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .verdict.right .count { color: var(--good); }
  .verdict.wrong .count { color: var(--danger); }
  .verdict .breakdown { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .verdict .result { font-size: 14px; margin-top: 8px; }
  .verdict .gone { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }

  /* Game over */
  .gameover .trophy { font-size: 48px; }
  .gameover .name { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .gameover .tag { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  .fade-in { animation: fade 0.16s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  @media (max-height: 640px) {
    .die { width: 34px; height: 34px; border-radius: 7px; }
    .pip { width: 4px; height: 4px; }
    .stepper .qty { font-size: 22px; }
    .bid .value { font-size: 20px; }
    .panel { padding: 12px 14px; }
    .brand-huge { font-size: 36px; }
    .room-code { font-size: 32px; }
  }
  @media (min-width: 480px) {
    .die { width: 42px; height: 42px; border-radius: 9px; }
    .pip { width: 6px; height: 6px; }
    .reveal-row .die { width: 32px; height: 32px; }
    .reveal-row .pip { width: 4px; height: 4px; }
  }
</style>
</head>
<body>

<main id="app"></main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="rules.js"></script>
<script>

// =================== State ===================

let state = null;
const PEER_PREFIX = 'spoton-x7k-';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const START_DICE = 5;
const MAX_PLAYERS = 6;

function freshState() {
  return {
    phase: 'menu',
    players: [],
    currentPlayer: 0,
    currentBid: null,
    lockedToOnes: false,
    history: [],
    round: 1,
    resolution: null,
    winner: null,
    bidDraft: null,
    mp: {
      mode: 'menu',
      username: localStorage.getItem('spoton:name') || '',
      roomCode: '',
      peer: null,
      conns: {},
      hostPeerId: null,
      myPlayerIdx: 0,
      busy: false,
      status: '',
      createForm: { username: '' },
      joinForm: { username: '', code: '' },
    },
  };
}

// =================== Helpers ===================

const PIPS = {
  1: ['mc'], 2: ['tl', 'br'], 3: ['tl', 'mc', 'br'],
  4: ['tl', 'tr', 'bl', 'br'], 5: ['tl', 'tr', 'mc', 'bl', 'br'],
  6: ['tl', 'tr', 'ml', 'mr', 'bl', 'br'],
};

function dieEl(face, opts = {}) {
  const e = document.createElement('div');
  const cls = ['die'];
  if (opts.match) cls.push('match');
  if (opts.hidden) cls.push('hidden');
  e.className = cls.join(' ');
  if (!opts.hidden) {
    for (const pos of PIPS[face] || []) {
      const pip = document.createElement('i');
      pip.className = `pip pip-${pos}`;
      e.appendChild(pip);
    }
  }
  return e;
}

const FACE_WORD = ['', 'one', 'two', 'three', 'four', 'five', 'six'];
function bidPhrase(bid) {
  return `${bid.quantity} ${FACE_WORD[bid.face]}${bid.quantity === 1 ? '' : 's'}`;
}
function findBidder(history) {
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].action === 'bid') return history[i].player;
  }
  return null;
}
function totalDiceOnTable(players) {
  return players.reduce((s, p) => s + (p.alive ? p.dice.length : 0), 0);
}
function initialDraft(currentBid, locked) {
  if (!currentBid) return { quantity: 1, face: 3 };
  if (locked) return { quantity: currentBid.quantity + 1, face: 1 };
  return { quantity: currentBid.quantity + 1, face: currentBid.face };
}
function minQty(face, currentBid, locked) {
  if (!currentBid) return 1;
  if (locked) return currentBid.quantity + 1;
  if (face > currentBid.face) return currentBid.quantity;
  if (face === currentBid.face) return currentBid.quantity + 1;
  return Infinity;
}
function availableFaces(currentBid, locked) {
  if (locked) return [1];
  if (!currentBid) return [1, 2, 3, 4, 5, 6];
  return [2, 3, 4, 5, 6].filter(f => f >= currentBid.face);
}
function generateRoomCode() {
  let c = '';
  for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}
function peerIdFor(code) { return PEER_PREFIX + code.toUpperCase(); }

function isHost() { return state.mp.mode === 'host'; }

function ensureBidDraft() {
  if (state.phase !== 'bidding') return;
  if (state.currentPlayer !== state.mp.myPlayerIdx) { state.bidDraft = null; return; }
  const ctx = `${state.currentBid ? state.currentBid.quantity + 'x' + state.currentBid.face : 'open'}-${state.lockedToOnes ? 'L' : 'U'}`;
  if (!state.bidDraft || state.bidDraft._ctx !== ctx) {
    state.bidDraft = initialDraft(state.currentBid, state.lockedToOnes);
    state.bidDraft._ctx = ctx;
  }
}

// =================== State mutators (host authoritative) ===================

function applyStart() {
  if (state.phase !== 'lobby') return false;
  if (state.players.length < 2) return false;
  for (const p of state.players) {
    p.dice = rollDice(START_DICE);
    p.alive = true;
  }
  state.currentPlayer = 0;
  state.currentBid = null;
  state.lockedToOnes = false;
  state.history = [];
  state.round = 1;
  state.resolution = null;
  state.winner = null;
  state.phase = 'bidding';
  return true;
}

function applyBid(playerIdx, bid) {
  if (state.phase !== 'bidding') return false;
  if (state.currentPlayer !== playerIdx) return false;
  if (!isValidRaise(bid, state.currentBid, state.lockedToOnes)) return false;
  state.history.push({ player: playerIdx, action: 'bid', bid: { quantity: bid.quantity, face: bid.face } });
  if (!state.currentBid && bid.face === 1) state.lockedToOnes = true;
  state.currentBid = { quantity: bid.quantity, face: bid.face };
  state.currentPlayer = nextAlivePlayer(state.players, state.currentPlayer);
  return true;
}

function applyLiar(playerIdx) {
  if (state.phase !== 'bidding') return false;
  if (state.currentPlayer !== playerIdx) return false;
  if (!state.currentBid) return false;
  const bidder = findBidder(state.history);
  const snapshot = state.players.map(p => p.alive ? p.dice.slice() : []);
  const r = resolveLiar(state.currentBid, snapshot.flat());
  const loser = r.loser === 'caller' ? playerIdx : bidder;
  state.history.push({ player: playerIdx, action: 'liar' });
  state.phase = 'reveal';
  state.resolution = {
    action: 'liar', caller: playerIdx, bidder,
    bid: state.currentBid, snapshot,
    actualCount: r.actualCount, bidHolds: r.bidHolds,
    diceChangePlayer: loser, diceChange: -1,
  };
  return true;
}

function applySpotOn(playerIdx) {
  if (state.phase !== 'bidding') return false;
  if (state.currentPlayer !== playerIdx) return false;
  if (!state.currentBid) return false;
  const snapshot = state.players.map(p => p.alive ? p.dice.slice() : []);
  const r = resolveSpotOn(state.currentBid, snapshot.flat());
  state.history.push({ player: playerIdx, action: 'spoton' });
  state.phase = 'reveal';
  state.resolution = {
    action: 'spoton', caller: playerIdx,
    bid: state.currentBid, snapshot,
    actualCount: r.actualCount, exact: r.exact,
    diceChangePlayer: playerIdx, diceChange: r.diceChange,
  };
  return true;
}

function applyNextRound() {
  if (state.phase !== 'reveal') return false;
  const r = state.resolution;
  const p = state.players[r.diceChangePlayer];
  const dc = applyDiceChange(p.dice.length, r.diceChange);
  if (dc.eliminated) { p.alive = false; p.dice = []; }
  for (const pl of state.players) {
    if (!pl.alive) continue;
    const count = pl === p ? dc.newCount : pl.dice.length;
    pl.dice = rollDice(count);
  }
  const winner = gameWinner(state.players);
  if (winner !== false) {
    state.winner = winner ? { name: winner.name } : null;
    state.phase = 'gameover';
    return true;
  }
  state.round += 1;
  state.currentBid = null;
  state.lockedToOnes = false;
  state.history = [];
  state.resolution = null;
  state.currentPlayer = nextStarter(state.players, r.diceChangePlayer);
  state.phase = 'bidding';
  return true;
}

// =================== UI actions ===================

function uiStart() {
  if (!isHost()) return;
  if (applyStart()) { broadcastState(); render(); }
}

function uiBid() {
  const bid = state.bidDraft;
  if (!bid || !isValidRaise(bid, state.currentBid, state.lockedToOnes)) return;
  const payload = { quantity: bid.quantity, face: bid.face };
  if (isHost()) {
    if (applyBid(state.mp.myPlayerIdx, payload)) { broadcastState(); render(); }
  } else {
    sendToHost({ type: 'action', action: 'bid', bid: payload });
  }
}

function uiLiar() {
  if (isHost()) {
    if (applyLiar(state.mp.myPlayerIdx)) { broadcastState(); render(); }
  } else {
    sendToHost({ type: 'action', action: 'liar' });
  }
}

function uiSpotOn() {
  if (isHost()) {
    if (applySpotOn(state.mp.myPlayerIdx)) { broadcastState(); render(); }
  } else {
    sendToHost({ type: 'action', action: 'spoton' });
  }
}

function uiNextRound() {
  if (isHost()) {
    if (applyNextRound()) { broadcastState(); render(); }
  } else {
    sendToHost({ type: 'action', action: 'nextRound' });
  }
}

// =================== Peer plumbing ===================

function sendToHost(msg) {
  const conn = state.mp.conns[state.mp.hostPeerId];
  if (conn && conn.open) {
    try { conn.send(msg); } catch (e) { console.warn('send failed', e); }
  }
}

function broadcastState() {
  if (!isHost()) return;
  for (const [peerId, conn] of Object.entries(state.mp.conns)) {
    const idx = state.players.findIndex(p => p.peerId === peerId);
    if (idx < 0 || !conn.open) continue;
    try { conn.send({ type: 'state', state: snapshotFor(idx) }); }
    catch (e) { console.warn('broadcast failed', e); }
  }
}

function snapshotFor(playerIdx) {
  return {
    phase: state.phase,
    round: state.round,
    currentPlayer: state.currentPlayer,
    currentBid: state.currentBid ? { quantity: state.currentBid.quantity, face: state.currentBid.face } : null,
    lockedToOnes: state.lockedToOnes,
    history: state.history,
    winner: state.winner,
    resolution: state.resolution,
    players: state.players.map((p, i) => ({
      name: p.name,
      alive: p.alive,
      online: p.online !== false,
      dice: i === playerIdx ? p.dice.slice() : new Array(p.dice.length).fill(0),
    })),
    myPlayerIdx: playerIdx,
    roomCode: state.mp.roomCode,
  };
}

function applySnapshot(snap) {
  state.phase = snap.phase;
  state.round = snap.round;
  state.currentPlayer = snap.currentPlayer;
  state.currentBid = snap.currentBid;
  state.lockedToOnes = snap.lockedToOnes;
  state.history = snap.history;
  state.players = snap.players;
  state.resolution = snap.resolution;
  state.winner = snap.winner;
  state.mp.myPlayerIdx = snap.myPlayerIdx;
  state.mp.roomCode = snap.roomCode;
}

// =================== Host / Client setup ===================

function createPeerWithId(id) {
  return new Promise((resolve, reject) => {
    if (typeof Peer === 'undefined') { reject(new Error('Network library not loaded')); return; }
    const peer = new Peer(id, { debug: 0 });
    let settled = false;
    const onOpen = () => {
      if (settled) return;
      settled = true;
      peer.off && peer.off('error', onErr);
      resolve(peer);
    };
    const onErr = (err) => {
      if (settled) return;
      settled = true;
      try { peer.destroy(); } catch (e) {}
      reject(err);
    };
    peer.on('open', onOpen);
    peer.on('error', onErr);
    setTimeout(() => {
      if (!settled) {
        settled = true;
        try { peer.destroy(); } catch (e) {}
        reject(new Error('Timed out reaching the broker'));
      }
    }, 9000);
  });
}

async function doCreate() {
  const username = (state.mp.createForm.username || '').trim().slice(0, 20);
  if (!username) return;
  state.mp.busy = true;
  state.mp.status = '';
  render();
  try {
    localStorage.setItem('spoton:name', username);
    state.mp.username = username;
    let peer, code;
    let lastErr;
    for (let attempt = 0; attempt < 5; attempt++) {
      code = generateRoomCode();
      try {
        peer = await createPeerWithId(peerIdFor(code));
        break;
      } catch (e) {
        lastErr = e;
        if (e && e.type !== 'unavailable-id') throw e;
      }
    }
    if (!peer) throw lastErr || new Error('Could not create lobby');
    state.mp.peer = peer;
    state.mp.hostPeerId = peer.id;
    state.mp.mode = 'host';
    state.mp.roomCode = code;
    state.mp.myPlayerIdx = 0;
    state.players = [{
      name: username, dice: [], alive: true, online: true, peerId: peer.id,
    }];
    state.phase = 'lobby';
    state.mp.busy = false;
    setupHostPeer(peer);
    render();
  } catch (e) {
    console.error(e);
    state.mp.busy = false;
    state.mp.status = friendlyError(e, 'create');
    state.phase = 'create';
    render();
  }
}

async function doJoin() {
  const username = (state.mp.joinForm.username || '').trim().slice(0, 20);
  const code = (state.mp.joinForm.code || '').toUpperCase();
  if (!username || code.length !== 4) return;
  state.mp.busy = true;
  state.mp.status = '';
  render();
  try {
    localStorage.setItem('spoton:name', username);
    state.mp.username = username;
    state.mp.mode = 'client';
    if (typeof Peer === 'undefined') throw new Error('Network library not loaded');
    const peer = new Peer({ debug: 0 });
    state.mp.peer = peer;
    await new Promise((resolve, reject) => {
      let opened = false;
      const onOpen = () => { opened = true; resolve(); };
      const onErr = (err) => { if (!opened) reject(err); };
      peer.on('open', onOpen);
      peer.on('error', onErr);
      setTimeout(() => { if (!opened) reject(new Error('Timed out reaching the broker')); }, 9000);
    });
    const hostId = peerIdFor(code);
    const conn = peer.connect(hostId, { reliable: true });
    state.mp.hostPeerId = hostId;
    state.mp.conns[hostId] = conn;
    await new Promise((resolve, reject) => {
      let opened = false;
      conn.on('open', () => {
        opened = true;
        try { conn.send({ type: 'join', username }); } catch (e) {}
        resolve();
      });
      conn.on('data', (msg) => handleHostMessage(msg));
      conn.on('close', () => {
        if (state.mp.mode === 'client') {
          state.mp.status = 'Lost connection to host';
          teardownPeer();
          state.phase = 'menu';
          render();
        }
      });
      conn.on('error', (err) => { if (!opened) reject(err); });
      peer.on('error', (err) => {
        if (!opened && err && err.type === 'peer-unavailable') {
          reject(new Error(`Room ${code} not found`));
        }
      });
      setTimeout(() => { if (!opened) reject(new Error(`Could not connect to room ${code}`)); }, 9000);
    });
    state.mp.busy = false;
    render();
  } catch (e) {
    console.error(e);
    teardownPeer();
    state.mp.busy = false;
    state.mp.status = friendlyError(e, 'join');
    state.phase = 'join';
    render();
  }
}

function setupHostPeer(peer) {
  peer.on('connection', (conn) => {
    conn.on('open', () => { /* wait for join message */ });
    conn.on('data', (msg) => {
      if (msg && msg.type === 'join') handleJoinRequest(conn, msg);
      else if (msg && msg.type === 'action') handleClientAction(conn, msg);
    });
    conn.on('close', () => {
      const idx = state.players.findIndex(p => p.peerId === conn.peer);
      delete state.mp.conns[conn.peer];
      if (idx >= 0) {
        if (state.phase === 'lobby') {
          state.players.splice(idx, 1);
          if (state.currentPlayer >= state.players.length) state.currentPlayer = 0;
        } else {
          state.players[idx].online = false;
        }
        broadcastState();
        render();
      }
    });
    conn.on('error', (err) => console.warn('conn error', err));
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', (err) => console.warn('peer error', err));
}

function handleJoinRequest(conn, msg) {
  const username = (msg.username || '').trim().slice(0, 20) || 'Player';
  state.mp.conns[conn.peer] = conn;
  if (state.phase === 'lobby') {
    if (state.players.length >= MAX_PLAYERS) {
      safeSend(conn, { type: 'error', message: 'Room is full' });
      setTimeout(() => { try { conn.close(); } catch (e) {} }, 200);
      return;
    }
    let finalName = username;
    let n = 2;
    while (state.players.some(p => p.name === finalName)) finalName = `${username} ${n++}`;
    const playerIdx = state.players.length;
    state.players.push({
      name: finalName, dice: [], alive: true, online: true, peerId: conn.peer,
    });
    safeSend(conn, { type: 'welcome', playerIdx, roomCode: state.mp.roomCode });
    broadcastState();
    render();
  } else {
    const existingIdx = state.players.findIndex(p => p.name === username && p.online === false);
    if (existingIdx >= 0) {
      state.players[existingIdx].online = true;
      state.players[existingIdx].peerId = conn.peer;
      safeSend(conn, { type: 'welcome', playerIdx: existingIdx, roomCode: state.mp.roomCode });
      broadcastState();
      render();
    } else {
      safeSend(conn, { type: 'error', message: 'Game already in progress' });
      setTimeout(() => { try { conn.close(); } catch (e) {} }, 200);
    }
  }
}

function handleClientAction(conn, msg) {
  const idx = state.players.findIndex(p => p.peerId === conn.peer);
  if (idx < 0) return;
  let ok = false;
  switch (msg.action) {
    case 'bid': ok = applyBid(idx, msg.bid); break;
    case 'liar': ok = applyLiar(idx); break;
    case 'spoton': ok = applySpotOn(idx); break;
    case 'nextRound': ok = applyNextRound(); break;
  }
  if (ok) { broadcastState(); render(); }
}

function handleHostMessage(msg) {
  if (!msg || !msg.type) return;
  if (msg.type === 'welcome') {
    state.mp.myPlayerIdx = msg.playerIdx;
    state.mp.roomCode = msg.roomCode;
  } else if (msg.type === 'state') {
    applySnapshot(msg.state);
    render();
  } else if (msg.type === 'error') {
    state.mp.status = msg.message || 'Error';
    teardownPeer();
    state.phase = 'menu';
    render();
  } else if (msg.type === 'bye') {
    state.mp.status = msg.reason || 'Host closed the room';
    teardownPeer();
    state.phase = 'menu';
    render();
  }
}

function safeSend(conn, msg) {
  if (!conn || !conn.open) return;
  try { conn.send(msg); } catch (e) { console.warn('send', e); }
}

function leaveRoom() {
  if (isHost()) {
    for (const conn of Object.values(state.mp.conns)) {
      safeSend(conn, { type: 'bye', reason: 'Host closed the room' });
    }
  } else {
    const conn = state.mp.conns[state.mp.hostPeerId];
    if (conn) { try { conn.close(); } catch (e) {} }
  }
  teardownPeer();
  state.phase = 'menu';
  state.mp.status = '';
  state.players = [];
  render();
}

function teardownPeer() {
  if (state.mp.peer) {
    try { state.mp.peer.destroy(); } catch (e) {}
  }
  state.mp.peer = null;
  state.mp.conns = {};
  state.mp.mode = 'menu';
  state.mp.hostPeerId = null;
  state.mp.myPlayerIdx = 0;
}

function friendlyError(e, ctx) {
  if (!e) return 'Something went wrong';
  if (e.message) return e.message;
  if (e.type === 'peer-unavailable') return 'Room not found';
  if (e.type === 'network') return 'Network error';
  if (e.type === 'unavailable-id' && ctx === 'create') return 'Try again, room code collision';
  return 'Could not connect';
}

// =================== DOM helper ===================

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'onclick') e.onclick = v;
    else if (k === 'oninput') e.oninput = v;
    else if (k === 'onkeydown') e.onkeydown = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'disabled') { if (v) e.disabled = true; }
    else if (k === 'ariaPressed') e.setAttribute('aria-pressed', v ? 'true' : 'false');
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

// =================== Render dispatcher ===================

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  ensureBidDraft();
  const fns = {
    menu: renderMenu,
    create: renderCreateForm,
    join: renderJoinForm,
    lobby: renderLobby,
    bidding: renderPlay,
    reveal: renderReveal,
    gameover: renderGameOver,
  };
  const fn = fns[state.phase];
  if (!fn) { console.error('unknown phase', state.phase); return; }
  const node = fn();
  node.classList.add('fade-in');
  app.appendChild(node);
}

function renderPlay() {
  const meIdx = state.mp.myPlayerIdx;
  const me = state.players[meIdx];
  const isMyTurn = state.currentPlayer === meIdx;
  const top = el('div', { class: 'top' }, [
    el('h1', {}, 'Spot On'),
    el('span', { class: 'crumb' }, `Round ${state.round}`),
  ]);

  const info = el('div', { class: 'panel', style: 'flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px;' });
  info.appendChild(renderBid());
  info.appendChild(el('div', { class: 'divider' }));
  info.appendChild(renderTable());

  let bottom, actions;
  if (!me.alive) {
    bottom = el('div', { class: 'panel', style: 'text-align:center; padding: 16px;' },
      el('div', { class: 'muted small' }, 'you are out, watching the table'));
  } else if (isMyTurn) {
    const picker = el('div', { class: 'panel' });
    picker.appendChild(renderPicker());
    bottom = picker;
    actions = renderActions();
  } else {
    const waiting = state.players[state.currentPlayer];
    const offline = waiting && waiting.online === false;
    bottom = el('div', { class: 'panel', style: 'text-align:center; padding: 16px;' },
      el('div', { class: 'muted small' },
        waiting
          ? `waiting for ${waiting.name}${offline ? ' (offline)' : ''}`
          : 'waiting'));
  }

  const children = [top, info, bottom];
  if (actions) children.push(actions);
  return el('div', { class: 'screen' }, children);
}

function renderTable() {
  const wrap = el('div', { style: 'flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;' });
  const meIdx = state.mp.myPlayerIdx;
  const order = [];
  state.players.forEach((p, i) => { if (i !== meIdx) order.push(i); });
  order.push(meIdx);
  for (const i of order) {
    const p = state.players[i];
    const isMe = i === meIdx;
    const isCurrent = i === state.currentPlayer;
    const dead = !p.alive;
    const offline = p.online === false;
    const row = el('div', { class: `seat${isMe ? ' me' : ''}${dead ? ' dead' : ''}${isCurrent && !dead ? ' active' : ''}` });
    const nameEl = el('div', { class: 'seat-name' });
    nameEl.appendChild(el('span', {}, isMe ? 'You' : p.name));
    if (offline && !dead) nameEl.appendChild(el('span', { class: 'tag offline' }, 'off'));
    row.appendChild(nameEl);
    const dr = el('div', { class: 'dice-row' });
    if (dead) {
      dr.appendChild(el('span', { class: 'small muted' }, 'out'));
    } else {
      for (const d of p.dice) {
        dr.appendChild(isMe ? dieEl(d) : dieEl(0, { hidden: true }));
      }
    }
    row.appendChild(dr);
    wrap.appendChild(row);
  }
  return wrap;
}

function renderBid() {
  const wrap = el('div', { class: 'bid' });
  if (state.currentBid) {
    const bidder = state.players[findBidder(state.history)];
    const bidderName = bidder ? (bidder.name || 'someone') : 'someone';
    const isMe = findBidder(state.history) === state.mp.myPlayerIdx;
    wrap.appendChild(el('div', { class: 'by' }, `${isMe ? 'You' : bidderName} bid`));
    wrap.appendChild(el('div', { class: 'value' }, [
      el('span', { class: 'num' }, String(state.currentBid.quantity)),
      ' ',
      FACE_WORD[state.currentBid.face] + (state.currentBid.quantity === 1 ? '' : 's'),
      state.lockedToOnes ? el('span', { class: 'badge' }, 'ones') : null,
    ]));
  } else {
    const opener = state.players[state.currentPlayer];
    const isMe = state.currentPlayer === state.mp.myPlayerIdx;
    wrap.appendChild(el('div', { class: 'by' }, isMe ? 'open the round' : `${opener ? opener.name : 'someone'} opens`));
    wrap.appendChild(el('div', { class: 'value muted' }, 'no bid yet'));
  }
  return wrap;
}

function renderPicker() {
  const draft = state.bidDraft;
  if (!draft) return el('div', {}, '');
  const wrap = el('div', { style: 'display:flex; flex-direction:column; gap:10px;' });
  const faces = el('div', { class: 'face-row' });
  const available = availableFaces(state.currentBid, state.lockedToOnes);
  for (const f of [1, 2, 3, 4, 5, 6]) {
    const b = el('button', { class: 'face-btn', ariaPressed: draft.face === f });
    b.appendChild(dieEl(f));
    if (!available.includes(f)) b.disabled = true;
    b.onclick = () => {
      draft.face = f;
      const m = minQty(f, state.currentBid, state.lockedToOnes);
      if (draft.quantity < m) draft.quantity = m;
      render();
    };
    faces.appendChild(b);
  }
  wrap.appendChild(faces);

  const min = minQty(draft.face, state.currentBid, state.lockedToOnes);
  const maxQty = Math.max(totalDiceOnTable(state.players), 99);
  const step = el('div', { class: 'stepper' });
  const minus = el('button', { class: 'step-btn' }, '−');
  minus.disabled = draft.quantity <= min;
  minus.onclick = () => { if (draft.quantity > min) { draft.quantity -= 1; render(); } };
  const qty = el('span', { class: 'qty' }, String(draft.quantity));
  const plus = el('button', { class: 'step-btn' }, '+');
  plus.disabled = draft.quantity >= maxQty;
  plus.onclick = () => { draft.quantity += 1; render(); };
  step.appendChild(minus); step.appendChild(qty); step.appendChild(plus);
  wrap.appendChild(step);
  return wrap;
}

function renderActions() {
  const draft = state.bidDraft;

  wrap.appendChild(primary);
  if (state.currentBid) {

function renderReveal() {
  const r = state.resolution;
  const top = el('div', { class: 'top' }, [
    el('h1', {}, 'Spot On'),
    el('span', { class: 'crumb' }, `Round ${state.round}`),
  ]);

  const callerName = state.players[r.caller] ? state.players[r.caller].name : '?';
  const bidder = r.action === 'liar' ? state.players[r.bidder] : null;
  const bidderName = bidder ? bidder.name : '';
  const story = el('div', { class: 'panel', style: 'text-align:center; font-size:14px;' });
  if (r.action === 'liar') {
    story.appendChild(el('span', {}, [
      el('strong', {}, callerName), ' called liar on ',
      el('strong', {}, bidderName), `'s ${bidPhrase(r.bid)}`,
    ]));
  } else {
    story.appendChild(el('span', {}, [
      el('strong', {}, callerName), ` called spot on ${bidPhrase(r.bid)}`,
    ]));
  }

  const diceP = el('div', { class: 'panel', style: 'flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto;' });
  state.players.forEach((p, i) => {
    const dead = !p.alive;
    const change = i === r.diceChangePlayer;
    const gained = change && r.diceChange > 0;
    const lost = change && r.diceChange < 0;
    const row = el('div', { class: `reveal-row${gained ? ' gained' : ''}${lost ? ' lost' : ''}${dead ? ' dead' : ''}` });
    row.appendChild(el('div', { class: 'name' }, i === state.mp.myPlayerIdx ? 'You' : p.name));
    const dr = el('div', { class: 'dice-row' });
    const dice = r.snapshot[i] || [];
    if (dice.length === 0) {
      dr.appendChild(el('span', { class: 'small muted' }, 'out'));
    } else {
      for (const d of dice) {
        const m = d === r.bid.face || (r.bid.face !== 1 && d === 1);
        dr.appendChild(dieEl(d, { match: m }));
      }
    }
    row.appendChild(dr);
    diceP.appendChild(row);
  });
  diceP.appendChild(el('div', { class: 'divider', style: 'margin: 8px 0;' }));
  diceP.appendChild(renderVerdict(r));

  const btn = el('button', { class: 'btn primary full' },
    gameWinner(state.players) !== false ? 'See result' : 'Next round');
  btn.onclick = uiNextRound;

  return el('div', { class: 'screen' }, [top, story, diceP, btn]);
}

function renderVerdict(r) {
  const positive = (r.action === 'liar' && !r.bidHolds) || (r.action === 'spoton' && r.exact);
  const v = el('div', { class: `verdict ${positive ? 'right' : 'wrong'}` });
  const word = FACE_WORD[r.bid.face] + (r.actualCount === 1 ? '' : 's');
  v.appendChild(el('div', { class: 'count' }, `${r.actualCount} ${word}`));
  if (r.bid.face !== 1) {
    const wilds = r.snapshot.flat().filter(d => d === 1).length;
    if (wilds > 0) v.appendChild(el('div', { class: 'breakdown' }, `${r.actualCount - wilds} natural, ${wilds} wild`));
  }
  const callerName = state.players[r.caller] ? state.players[r.caller].name : '?';
  let line;
  if (r.action === 'liar') {
    const bidderName = state.players[r.bidder] ? state.players[r.bidder].name : '?';
    line = r.bidHolds
      ? `${bidderName} had it. ${callerName} loses a die.`
      : `${bidderName} was bluffing. They lose a die.`;
  } else {
    line = r.exact
      ? `Nailed it. ${callerName} gains a die.`
      : `Off. ${callerName} loses a die.`;
  }
  v.appendChild(el('div', { class: 'result' }, line));
  const target = state.players[r.diceChangePlayer];
  if (r.diceChange < 0 && target && target.dice.length + r.diceChange <= 0) {
    v.appendChild(el('div', { class: 'gone' }, `${target.name} is out.`));
  }
  return v;
}

function renderGameOver() {
  const wrap = el('div', { class: 'screen center gameover' });
  wrap.appendChild(el('div', { class: 'trophy' }, '\u{1F3C6}'));
  wrap.appendChild(el('div', { class: 'name' }, state.winner ? state.winner.name : 'No one'));
  wrap.appendChild(el('div', { class: 'tag' }, 'takes the round'));
  const btn = el('button', { class: 'btn primary' }, 'Back to menu');
  btn.onclick = () => {
    leaveRoom();
  };
  wrap.appendChild(btn);
  return wrap;
}

// =================== Init ===================

state = freshState();
render();

window.addEventListener('beforeunload', () => {
  if (state && state.mp && state.mp.peer) {
    try { state.mp.peer.destroy(); } catch (e) {}
  }
});

</script>
